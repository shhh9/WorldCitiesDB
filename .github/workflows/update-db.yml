name: Update Cities Database

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run BuildDB
        run: |
          swift run BuildDB Sources/WorldCitiesDB/Resources/cities.wcdb

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet Sources/WorldCitiesDB/Resources/cities.wcdb 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated database
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sources/WorldCitiesDB/Resources/cities.wcdb
          git commit -m "Update cities database from GeoNames"
          git push

      - name: Tag new version
        if: steps.check.outputs.changed == 'true'
        run: |
          git fetch --tags
          LATEST=$(git tag -l --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="1.0.1"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW_TAG="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "Tagging $NEW_TAG"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
