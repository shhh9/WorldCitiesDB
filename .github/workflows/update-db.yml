name: Update Cities Database

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run BuildDB
        run: |
          swift run BuildDB Sources/WorldCitiesDB/Resources/cities.lz4

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet Sources/WorldCitiesDB/Resources/cities.lz4 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated database
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sources/WorldCitiesDB/Resources/cities.lz4
          git commit -m "Update cities database from GeoNames"
          git push
